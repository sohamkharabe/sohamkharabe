ext><text x="60" y="930" xml:space="preserve"><tspan fill="#484f58">-------------</tspan></text><text x="60" y="946" xml:space="preserve"><tspan fill="#ecf2f8">Hi, I'm </tspan><tspan fill="#7ce38b" font-weight="bold">Soham Kharabe</tspan></text><text x="60" y="962" xml:space="preserve"><tspan fill="#ecf2f8">I am an </tspan><tspan fill="#faa356">AIML B.Tech student</tspan><tspan fill="#ecf2f8"> specializing in Artificial Intelligence.</tspan></text><text x="60" y="978" xml:space="preserve"><tspan fill="#ecf2f8">Focused on building </tspan><tspan fill="#77bdfb">innovative AI solutions</tspan><tspan fill="#ecf2f8"> and creative design.</tspan></text><text x="60" y="994" xml:space="preserve"><tspan fill="#ecf2f8"> </tspan></text><text x="60" y="1010" xml:space="preserve"><tspan fill="#ecf2f8">Driven by a passion for neural networks and system architecture.</tspan></text>
